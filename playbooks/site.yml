---
- name: Lab RPi5 — base + KDE Plasma
  hosts: rpi5
  gather_facts: true
  roles:
    - role: common
    - role: kde_plasma
  post_tasks:
    - name: Redémarrer pour démarrer sur Plasma / SDDM
      ansible.builtin.reboot:
        msg: Redémarrage après installation KDE Plasma
        reboot_timeout: 600
      when: reboot_after_install | default(true) | bool
