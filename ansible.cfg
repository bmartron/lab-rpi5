[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
gathering = smart
fact_caching = memory
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
# Lab: sshpass + password — pas de ControlMaster (instable avec password)
pipelining = False
ssh_args = -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no
